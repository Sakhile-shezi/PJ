name: Build and Release JAR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Package JAR
        run: |
          mkdir -p out
          javac -d out TictTacToe/src/tic1/TicTacToe.java
          printf "Main-Class: tic1.TicTacToe\n" > manifest.txt
          jar cfm TicTacToe.jar manifest.txt -C out .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" TicTacToe.jar \
            --title "Tic-Tac-Toe ${{ inputs.tag }}" \
            --notes "Runnable desktop JAR for Tic-Tac-Toe (Java Swing)."
